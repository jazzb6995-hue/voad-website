<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Posts | VOAD Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #F8F7F4; color: #0D0D0D; min-height: 100vh; }

    .topbar { background: #0D0D0D; color: #fff; padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-logo { font-weight: 700; font-size: 18px; letter-spacing: .1em; }
    .topbar-actions { display: flex; gap: 12px; align-items: center; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: background .2s, color .2s; text-decoration: none; }
    .btn-primary   { background: #B85C38; color: #fff; }
    .btn-primary:hover { background: #a04e2e; }
    .btn-ghost { background: transparent; color: #aaa; border: 1px solid #333; }
    .btn-ghost:hover { color: #fff; border-color: #666; }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn-danger:hover { background: #a93226; }

    main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .page-title { font-size: 26px; font-weight: 700; }

    .table-wrap { background: #fff; border: 1px solid #e8e4df; border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #f3f1ee; }
    th { text-align: left; padding: 13px 16px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #777; }
    td { padding: 14px 16px; font-size: 14px; border-top: 1px solid #f0ede9; vertical-align: middle; }
    tr:hover td { background: #faf9f7; }
    .cover-thumb { width: 80px; height: 50px; object-fit: cover; border-radius: 5px; }
    .badge { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .badge-published  { background: #e8f4ea; color: #2e7d32; }
    .badge-draft      { background: #f3f1ee; color: #888; }
    .row-actions { display: flex; gap: 8px; }
    .empty { text-align: center; padding: 60px; color: #aaa; }
    .status-bar { background: #e8f4ea; color: #2e7d32; padding: 12px 20px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none; }
    .status-bar.error { background: #fce4ec; color: #c62828; }

    @media (max-width: 700px) {
      .topbar { padding: 0 16px; }
      main { padding: 24px 16px; }
      .col-cover, .col-date, .col-cat { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">VOAD Admin</div>
    <div class="topbar-actions">
      <a href="/admin/dashboard.html" class="btn btn-ghost">Projects</a>
      <a href="/admin/media.html" class="btn btn-ghost">Site Images</a>
      <a href="/blog" class="btn btn-ghost" target="_blank">View Blog &#8599;</a>
      <button class="btn btn-ghost" id="logout-btn">Logout</button>
    </div>
  </div>

  <main>
    <div class="page-header">
      <h1 class="page-title">Blog Posts</h1>
      <a href="/admin/blog-editor.html" class="btn btn-primary">+ New Post</a>
    </div>

    <div class="status-bar" id="status-bar"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-cover">Cover</th>
            <th>Title</th>
            <th class="col-cat">Category</th>
            <th class="col-date">Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="blogs-tbody">
          <tr><td colspan="6" class="empty">Loading posts&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const token = sessionStorage.getItem('voad_token');
    if (!token) location.href = '/admin/index.html';

    const tbody    = document.getElementById('blogs-tbody');
    const statusBar = document.getElementById('status-bar');

    function showStatus(msg, isError = false) {
      statusBar.textContent = msg;
      statusBar.className   = 'status-bar' + (isError ? ' error' : '');
      statusBar.style.display = 'block';
      setTimeout(() => { statusBar.style.display = 'none'; }, 4000);
    }

    async function loadBlogs() {
      try {
        const res  = await fetch('/api/blogs');
        const data = await res.json();
        renderTable(data);
      } catch {
        tbody.innerHTML = `<tr><td colspan="6" class="empty">Failed to load posts. Check your connection.</td></tr>`;
      }
    }

    function renderTable(blogs) {
      if (!blogs.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty">No posts yet. Write your first one &rarr;</td></tr>`;
        return;
      }
      tbody.innerHTML = blogs.map(b => {
        const dateStr = b.date ? new Date(b.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        const statusCls = b.published ? 'badge-published' : 'badge-draft';
        const statusTxt = b.published ? 'Published' : 'Draft';
        return `
          <tr>
            <td class="col-cover">
              <img class="cover-thumb" src="${b.coverImage || ''}" alt="${b.title}" loading="lazy"
                   onerror="this.style.background='#f0ede9';this.removeAttribute('src')" />
            </td>
            <td><strong>${b.title}</strong><br><span style="font-size:12px;color:#aaa;">${b.excerpt ? b.excerpt.substring(0,70) + '...' : ''}</span></td>
            <td class="col-cat">${b.category || ''}</td>
            <td class="col-date">${dateStr}</td>
            <td><span class="badge ${statusCls}">${statusTxt}</span></td>
            <td>
              <div class="row-actions">
                <a href="/admin/blog-editor.html?id=${b.id}" class="btn btn-primary" style="font-size:13px;padding:6px 12px;">Edit</a>
                <button class="btn btn-danger" style="font-size:13px;padding:6px 12px;" onclick="deletePost('${b.id}', '${b.title.replace(/'/g, "\\'")}')">Delete</button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    async function deletePost(id, title) {
      if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
      try {
        const res = await fetch('/api/blogs', {
          method:  'DELETE',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body:    JSON.stringify({ id })
        });
        const data = await res.json();
        if (data.ok) {
          showStatus(`"${title}" deleted.`);
          loadBlogs();
        } else {
          showStatus(data.error || 'Delete failed.', true);
        }
      } catch {
        showStatus('Delete failed. Check your connection.', true);
      }
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem('voad_token');
      location.href = '/admin/index.html';
    });

    loadBlogs();
  </script>
</body>
</html>
